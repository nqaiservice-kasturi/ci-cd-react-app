trigger:
  branches:
    include:
      - supriya

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: CI
    displayName: 'CI - Build and Validate'

    jobs:
      - job: Build
        displayName: 'Build React Application'

        steps:
          - task: UseNode@1
            inputs:
              version: '20.x'
            displayName: 'Use Node.js 20'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run lint
            displayName: 'Run ESLint'

          - script: npm run build
            displayName: 'Build React application'

          - script: |
              echo "Checking dist folder..."
              ls -la dist
            displayName: 'Verify dist folder'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/dist'
              artifact: 'react-dist'
              publishLocation: 'pipeline'
            displayName: 'Publish dist artifact'

  - stage: CD
    displayName: 'CD - Deploy to Azure'
    dependsOn: CI
    condition: succeeded()

    jobs:
      - job: Deploy
        displayName: 'Deploy React Application'

        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: 'react-dist'
              targetPath: '$(Pipeline.Workspace)/react-dist'
            displayName: 'Download dist artifact'

          - script: |
              echo "Checking downloaded artifact..."
              ls -la "$(Pipeline.Workspace)/react-dist"
            displayName: 'Verify downloaded artifact'

          - task: AzureCLI@2
            inputs:
              azureSubscription: 'sc-cicd-react-azure'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Deploying React application to Azure Storage..."

                az storage blob upload-batch \
                  --account-name stcicdreactkasturi \
                  --destination '$web' \
                  --source "$(Pipeline.Workspace)/react-dist" \
                  --overwrite true \
                  --auth-mode login \
                  --only-show-errors

                echo "Deployment completed successfully."
            displayName: 'Deploy React app to Azure Static Website'